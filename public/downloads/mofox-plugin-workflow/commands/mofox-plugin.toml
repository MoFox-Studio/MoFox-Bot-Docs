description = "Neo-MoFox 插件开发全流程：想法扩展 → 方案确认 → 开发 → 测试 → 集成验证 → 上线报告"
prompt = """调用 mofox-plugin-workflow Skill，为用户的插件需求执行完整开发流程。

用户输入：{{args}}

如果 {{args}} 为空，先问用户想做什么插件，然后再继续。

严格按 Skill 中的六阶段执行，不要跳步：

Phase 0 环境探测（自动，不问用户；不要假设任何路径）
  - 确认项目根含 src/app/plugin_system
  - 探测解释器 $PY：.venv/Scripts/python.exe → .venv/bin/python → command -v python3/python
  - 探测插件目录 $PLUGINS_DIR：用 "$PY" -X utf8 和 Python 3.11 tomllib 读取 config/*.toml 的 plugins_dir，默认 plugins
  - 探测 $SKILL_DIR：$HOME/.claude/skills/mofox-plugin-workflow 或 .claude/skills/mofox-plugin-workflow
  - 判断目标插件是否为独立 git 仓库（ls -d $PLUGINS_DIR/<name>/.git），决定测试落点
  - ls "$PLUGINS_DIR" 看已有插件，读一个同类型的作为参照
  - 检查 mpdt --version（可选工具，不可用时降级手写）
  - 所有 python 调用统一 "$PY" -X utf8 <...>

Phase 1 需求扩展
  - 先做一轮扩展把隐含需求显性化
  - 再用 AskUserQuestion 提 2-4 个真正影响组件选型的问题

Phase 2 组件选型 + 设计方案
  - 按 Skill 的决策表选组件
  - 输出完整设计方案（组件清单/数据流/配置项/文件结构/测试计划/文档交付计划）
  - 文档计划按 references/documentation-rules.md 判断 README、CHANGELOG、LICENSE、API 文档是否适用，禁止空/重复/过程文档
  - 用 ExitPlanMode 请求确认，用户没点头绝不写代码

Phase 3 开发
  - 优先 mpdt plugin init/generate 生成骨架，不可用时按 references/plugin-template.md 手写
  - 遵守 Skill 列出的框架事实（manifest.name == plugin_name、组件统一 name/description、Config 使用 ClassVar、Action/Agent 非空 associated_types、配置类只放 configs、相对导入、task_manager 等）
  - 按文档交付计划同步 README 等适用文档，确保 manifest、组件签名、配置、命令、依赖和版本描述与实现一致
  - 不创建空 CHANGELOG/LICENSE/API 文档，不复制重复说明，不记录开发过程

Phase 4 写测试
  - 测试落点 $TEST_DIR：
      改已有插件 → 跟随该插件现有约定（先 ls 插件内 tests/ 和主仓 test/plugins/<name>/，
                    已有哪个就加哪个；
                    不要按规则强行搬动已有测试）
      新建插件   → 独立 git 仓库放 $PLUGINS_DIR/<name>/tests/，主仓插件放 test/plugins/<name>/
  - 按 references/test-patterns.md 的 fake 对象模式
  - 必须包含 conftest.py（Windows 事件循环 + 存储隔离；向上查找同时包含 src/app/plugin_system 与 pyproject.toml 的项目根）

Phase 5 集成验证（三层，前一层不过不进下一层）
  1. ruff check "$PLUGINS_DIR/<name>/"
  2. "$PY" -X utf8 "$SKILL_DIR/scripts/verify_plugin.py" "$PLUGINS_DIR/<name>" --timeout 30
     目录插件本体使用一次性 worker、临时 cwd、真实 load/unload；仅保证框架自动生成的相对路径 Config 位于临时 cwd，不是安全沙箱，模块导入、绝对路径、网络、外部数据库和子进程副作用无法撤销
     不加载外部依赖插件；合法外部组件依赖必须保留 RUNTIME/WARN，说明目标插件本体已通过但依赖组件运行可用性未动态验证
     默认抑制自定义 lifecycle；只有确认副作用可接受才加 --lifecycle；timeout 只终止 worker，不保证回收插件后代进程
     按 FRAMEWORK/POLICY/RUNTIME 和动态计数报告；目标 0 FAIL，仅无未验证外部依赖和相关风险时可声称 0 WARN / 0 FAIL
  3. "$PY" -X utf8 -m pytest "$TEST_DIR" -q --no-cov -p no:randomly
  4. 人工核对 manifest、实际注册组件、README/适用文档和全部版本源一致；禁止空、重复、过期或过程文档

Phase 6 上线报告
  - 交付清单 + 组件表 + 验证结果表（带实际命令和输出）+ 已覆盖场景 + 未覆盖限制 + 用户需手工做的事
  - 报告文档交付和 manifest/组件/README/版本源人工一致性检查结果
  - 按 references/commit-rules.md 只起草 SemVer 建议和 type(scope): subject commit 建议，说明独立插件仓库/主仓/跨仓归属
  - 按用户偏好不自动添加 Co-Authored-By；不执行版本递增、commit、build、push 或发布

硬约束：
- 禁止修改 src/kernel、src/core、src/app
- 版本递增 / git commit / build/package / git push / mpdt market publish / package-update / release/tag/上传制品必须逐项单独问用户确认
- 不硬编码 API key

参考资料优先级（冲突时以高优先级为准）：
1. 源码（src/core/components/loader.py、src/core/managers/plugin_manager.py 等）
2. AI插件编写规范.md
3. docs/（docs/app/plugin_system.md、docs/examples/manifest_example.json 等可读，
   但注意文档可能滞后于实现，与源码冲突时以源码为准）
"""
