description = "验证一个 Neo-MoFox 目录插件能否被框架正确加载"
prompt = """对目录插件执行框架本体加载/卸载验证。

插件路径：{{args}}

如果 {{args}} 为空，先探测插件目录并列出候选让用户选择。

先在 Neo-MoFox 根目录探测并保存变量，后续全部复用：

    PY=$(ls .venv/Scripts/python.exe 2>/dev/null || ls .venv/bin/python 2>/dev/null \
      || command -v python3 || command -v python)
    PLUGINS_DIR=$("$PY" -X utf8 - <<'PY'
from pathlib import Path
import tomllib

for path in sorted(Path("config").glob("*.toml")):
    try:
        data = tomllib.loads(path.read_text(encoding="utf-8"))
    except (OSError, tomllib.TOMLDecodeError):
        continue
    value = data.get("plugins_dir") or data.get("core", {}).get("plugins_dir")
    if isinstance(value, str) and value.strip():
        print(value.strip())
        break
else:
    print("plugins")
PY
)
    SKILL_DIR=$(ls -d ".claude/skills/mofox-plugin-workflow" 2>/dev/null \
      || ls -d "$HOME/.claude/skills/mofox-plugin-workflow" 2>/dev/null)
    PLUGIN_DIR={{args}}

执行步骤：
1. `ruff check "$PLUGIN_DIR"`
2. `"$PY" -X utf8 "$SKILL_DIR/scripts/verify_plugin.py" "$PLUGIN_DIR" --timeout 30`
3. 查找已有插件内 tests/test 和主仓 test/plugins/<name>；找到哪个跑哪个：
   `"$PY" -X utf8 -m pytest "$TEST_DIR" -q --no-cov -p no:randomly`

验证器只覆盖目录插件本体的框架 load/unload。一次性 worker 切到临时 cwd，
仅保证框架自动生成的相对路径 Config 位于临时 cwd；这不是安全沙箱，模块导入、
绝对路径、网络、外部数据库和子进程副作用无法撤销。它不会加载外部依赖插件；
合法外部组件依赖仍产生 RUNTIME/WARN，表示目标插件本体 load/unload 已通过，
但依赖组件运行可用性未动态验证。默认抑制插件自定义 lifecycle；只有用户确认
副作用可接受时才追加 `--lifecycle`。`--timeout` 只终止 worker，不保证回收插件
自行创建的后代进程。
可用参数还有 `--json`、`--strict`、`--project-root PATH`、`--timeout SECONDS`。

报告按 FRAMEWORK / POLICY / RUNTIME 分类；检查总数动态变化，不声称固定项数。
对每条 FAIL/WARN 说明分类、根因和修复建议。最终只给出目标插件框架本体能否真实 load/unload 的结论；仅在无未验证外部依赖和相关风险时声称 0 WARN / 0 FAIL。
"""
