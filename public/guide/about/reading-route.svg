<text x="32" y="53" font-size="29" fill="#20384e" font-weight="700" text-anchor="start">第一次部署，按这条路线读</text>
<text x="32" y="88" font-size="20" fill="#52677b" font-weight="400" text-anchor="start">先让 Bot 回复一条消息，再慢慢扩展功能。</text>
<rect x="32" y="118" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="157" r="19" fill="#247d75"/><text x="65" y="165" font-size="22" fill="white" font-weight="600" text-anchor="middle">1</text><text x="105" y="166" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">先认识它</text><text x="396" y="166" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">了解组成；遇到生词查名词小课堂</text><path d="M480 200 L480 214" fill="none" stroke="#247d75" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="219" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="258" r="19" fill="#247d75"/><text x="65" y="266" font-size="22" fill="white" font-weight="600" text-anchor="middle">2</text><text x="105" y="267" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">选择一条部署路线</text><text x="396" y="267" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">按设备选：启动器 / 安卓 / Docker / 手动</text><path d="M480 301 L480 315" fill="none" stroke="#247d75" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="320" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="359" r="19" fill="#247d75"/><text x="65" y="367" font-size="22" fill="white" font-weight="600" text-anchor="middle">3</text><text x="105" y="368" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">跟完部署教程</text><text x="396" y="368" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">安装 → 模型与主人设置 → QQ 接入</text><path d="M480 402 L480 416" fill="none" stroke="#247d75" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="421" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="460" r="19" fill="#247d75"/><text x="65" y="468" font-size="22" fill="white" font-weight="600" text-anchor="middle">4</text><text x="105" y="469" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">验证后再扩展</text><text x="396" y="469" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">私聊确认回复，再学人设、插件与维护</text><text x="32" y="531" font-size="18" fill="#52677b" font-weight="400" text-anchor="start">流程示意 · 配置与操作见对应教程</text></g></svg>
