<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="title desc">
<title id="title">第一次部署，按这条路线读</title><desc id="desc">先让 Bot 回复一条消息，再慢慢扩展功能。</desc>
