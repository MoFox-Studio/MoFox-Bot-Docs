<svg xmlns="http://www.w3.org/2000/svg" width="960" height="657" viewBox="0 0 960 657" role="img" aria-labelledby="title desc">
<title id="title">Bot 掉线时，先检查后台保活</title><desc id="desc">系统策略因机型而异，以实际授权与运行结果为准。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#247d75"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
<rect x="1" y="1" width="958" height="655" rx="22" fill="#f7f9fc" stroke="#d5e0eb" stroke-width="2"/>
<text x="32" y="53" font-size="29" fill="#20384e" font-weight="700" text-anchor="start">Bot 掉线时，先检查后台保活</text>
<text x="32" y="88" font-size="20" fill="#52677b" font-weight="400" text-anchor="start">系统策略因机型而异，以实际授权与运行结果为准。</text>
<rect x="32" y="118" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="157" r="19" fill="#247d75"/><text x="65" y="165" font-size="22" fill="white" font-weight="600" text-anchor="middle">1</text><text x="105" y="166" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">通知权限</text><text x="396" y="166" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">允许显示前台服务通知</text><rect x="32" y="219" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="258" r="19" fill="#247d75"/><text x="65" y="266" font-size="22" fill="white" font-weight="600" text-anchor="middle">2</text><text x="105" y="267" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">忽略电池优化</text><text x="396" y="267" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">允许应用持续在后台运行</text><rect x="32" y="320" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="359" r="19" fill="#247d75"/><text x="65" y="367" font-size="22" fill="white" font-weight="600" text-anchor="middle">3</text><text x="105" y="368" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">前台保活服务</text><text x="396" y="368" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">检查是否已开启守护服务</text><rect x="32" y="421" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="460" r="19" fill="#247d75"/><text x="65" y="468" font-size="22" fill="white" font-weight="600" text-anchor="middle">4</text><text x="105" y="469" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">开机自启声明</text><text x="396" y="469" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">实际触发仍受系统策略限制</text><rect x="32" y="522" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="561" r="19" fill="#247d75"/><text x="65" y="569" font-size="22" fill="white" font-weight="600" text-anchor="middle">5</text><text x="105" y="570" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">厂商自启动与任务锁定</text><text x="396" y="570" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">检查手机厂商额外提供的后台限制</text><text x="32" y="632" font-size="18" fill="#52677b" font-weight="400" text-anchor="start">检查示意 · 完成后实际测试锁屏与后台运行</text></g></svg>
