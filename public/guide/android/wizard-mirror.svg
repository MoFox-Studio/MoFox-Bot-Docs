<svg xmlns="http://www.w3.org/2000/svg" width="960" height="346" viewBox="0 0 960 346" role="img" aria-labelledby="title desc">
<title id="title">实例向导：选择下载源</title><desc id="desc">此处比较的是下载源，不是模型服务商。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#247d75"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
<rect x="1" y="1" width="958" height="344" rx="22" fill="#f7f9fc" stroke="#d5e0eb" stroke-width="2"/>
<text x="32" y="53" font-size="29" fill="#20384e" font-weight="700" text-anchor="start">实例向导：选择下载源</text>
<text x="32" y="88" font-size="20" fill="#52677b" font-weight="400" text-anchor="start">此处比较的是下载源，不是模型服务商。</text>
<rect x="32" y="116" width="270" height="164" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="62" cy="148" r="19" fill="#247d75"/><text x="62" y="156" font-size="22" fill="white" font-weight="600" text-anchor="middle">1</text><text x="92" y="156" font-size="23" fill="#20384e" font-weight="600" text-anchor="start">等待下载源检测</text><text x="52" y="201" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">GitHub 与加速源</text><text x="52" y="231" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">查看实际检测结果</text><path d="M310 198 L336 198" fill="none" stroke="#247d75" stroke-width="3" marker-end="url(#arrow)"/><rect x="344" y="116" width="270" height="164" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="374" cy="148" r="19" fill="#247d75"/><text x="374" y="156" font-size="22" fill="white" font-weight="600" text-anchor="middle">2</text><text x="404" y="156" font-size="23" fill="#20384e" font-weight="600" text-anchor="start">确认要使用的源</text><text x="364" y="201" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">可保留自动选择</text><text x="364" y="231" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">也可手动切换来源</text><path d="M622 198 L648 198" fill="none" stroke="#247d75" stroke-width="3" marker-end="url(#arrow)"/><rect x="656" y="116" width="270" height="164" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="686" cy="148" r="19" fill="#247d75"/><text x="686" y="156" font-size="22" fill="white" font-weight="600" text-anchor="middle">3</text><text x="716" y="156" font-size="23" fill="#20384e" font-weight="600" text-anchor="start">继续实例向导</text><text x="676" y="201" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">后续从此源下载源码</text><text x="676" y="231" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">失败时检查网络再重试</text><text x="32" y="321" font-size="18" fill="#52677b" font-weight="400" text-anchor="start">步骤示意 · 非界面截图</text></g></svg>
