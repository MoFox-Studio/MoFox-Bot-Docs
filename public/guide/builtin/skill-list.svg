<svg xmlns="http://www.w3.org/2000/svg" width="960" height="346" viewBox="0 0 960 346" role="img" aria-labelledby="title desc">
<title id="title">技能管理：刷新与查看索引</title><desc id="desc">管理命令由主人执行；Bot 按需读取技能内容。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#247d75"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
<rect x="1" y="1" width="958" height="344" rx="22" fill="#f7f9fc" stroke="#d5e0eb" stroke-width="2"/>
<text x="32" y="53" font-size="29" fill="#20384e" font-weight="700" text-anchor="start">技能管理：刷新与查看索引</text>
<text x="32" y="88" font-size="20" fill="#52677b" font-weight="400" text-anchor="start">管理命令由主人执行；Bot 按需读取技能内容。</text>
<rect x="32" y="116" width="270" height="164" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="62" cy="148" r="19" fill="#247d75"/><text x="62" y="156" font-size="22" fill="white" font-weight="600" text-anchor="middle">1</text><text x="92" y="156" font-size="23" fill="#20384e" font-weight="600" text-anchor="start">放好技能文件</text><text x="52" y="201" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">技能目录包含 SKILL.md</text><text x="52" y="231" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">默认扫描 skill/ 目录</text><path d="M310 198 L336 198" fill="none" stroke="#247d75" stroke-width="3" marker-end="url(#arrow)"/><rect x="344" y="116" width="270" height="164" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="374" cy="148" r="19" fill="#247d75"/><text x="374" y="156" font-size="22" fill="white" font-weight="600" text-anchor="middle">2</text><text x="404" y="156" font-size="23" fill="#20384e" font-weight="600" text-anchor="start">刷新技能索引</text><text x="364" y="201" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">主人执行 /skill refresh</text><text x="364" y="231" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">重新扫描配置的目录</text><path d="M622 198 L648 198" fill="none" stroke="#247d75" stroke-width="3" marker-end="url(#arrow)"/><rect x="656" y="116" width="270" height="164" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="686" cy="148" r="19" fill="#247d75"/><text x="686" y="156" font-size="22" fill="white" font-weight="600" text-anchor="middle">3</text><text x="716" y="156" font-size="23" fill="#20384e" font-weight="600" text-anchor="start">查看技能列表</text><text x="676" y="201" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">主人执行 /skill list</text><text x="676" y="231" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">核对已登记的技能</text><text x="32" y="321" font-size="18" fill="#52677b" font-weight="400" text-anchor="start