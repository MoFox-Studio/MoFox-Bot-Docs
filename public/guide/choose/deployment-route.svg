<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">先看设备，再选管理方式</title><desc id="desc">四条路线各有适用环境；选一篇教程完整跟下来。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#247d75"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
<rect x="1" y="1" width="958" height="538" rx="22" fill="#f7f9fc" stroke="#d5e0eb" stroke-width="2"/>
<text x="32" y="53" font-size="29" fill="#20384e" font-weight="700" text-anchor="start">先看设备，再选管理方式</text>
<text x="32" y="88" font-size="20" fill="#52677b" font-weight="400" text-anchor="start">四条路线各有适用环境；选一篇教程完整跟下来。</text>
<rect x="32" y="116" width="430" height="164" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="62" cy="148" r="19" fill="#247d75"/><text x="62" y="156" font-size="22" fill="white" font-weight="600" text-anchor="middle">1</text><text x="92" y="156" font-size="23" fill="#20384e" font-weight="600" text-anchor="start">Windows / Linux 桌面</text><text x="52" y="201" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">想用图形界面管理</text><text x="52" y="231" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">→ 启动器部署</text><rect x="498" y="116" width="430" height="164" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="528" cy="148" r="19" fill="#247d75"/><text x="528" y="156" font-size="22" fill="white" font-weight="600" text-anchor="middle">2</text><text x="558" y="156" font-size="23" fill="#20384e" font-weight="600" text-anchor="start">兼容的安卓手机 / 平板</text><text x="518" y="201" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">愿意配置手机后台保活</text><text x="518" y="231" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">→ 安卓 App 部署</text><rect x="32" y="310" width="430" height="164" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="62" cy="342" r="19" fill="#247d75"/><text x="62" y="350" font-size="22" fill="white" font-weight="600" text-anchor="middle">3</text><text x="92" y="350" font-size="23" fill="#20384e" font-weight="600" text-anchor="start">Linux 服务器 / 合适的 NAS</text><text x="52" y="395" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">能用终端与 Docker</text><text x="52" y="425" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">→ Docker 部署</text><rect x="498" y="310" width="430" height="164" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="528" cy="342" r="19" fill="#247d75"/><text x="528" y="350" font-size="22" fill="white" font-weight="600" text-anchor="middle">4</text><text x="558" y="350" font-size="23" fill="#20384e" font-weight="600" text-anchor="start">Windows / Linux 自管环境</text><text x="518" y="395" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">要改源码或自己管理依赖</text><text x="518" y="425" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">→ 手动命令行部署</text><text x="32" y="515" font-size="18" fill="#52677b" font-weight="400" text-anchor="start">选择示意 · 平台要求请核对部署教程</text></g></svg>
