<svg xmlns="http://www.w3.org/2000/svg" width="960" height="657" viewBox="0 0 960 657" role="img" aria-labelledby="title desc">
<title id="title">安装完成，还要确认这五件事</title><desc id="desc">“进程启动”与“能聊天”之间，还有连接与配置检查。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#247d75"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
<rect x="1" y="1" width="958" height="655" rx="22" fill="#f7f9fc" stroke="#d5e0eb" stroke-width="2"/>
<text x="32" y="53" font-size="29" fill="#20384e" font-weight="700" text-anchor="start">安装完成，还要确认这五件事</text>
<text x="32" y="88" font-size="20" fill="#52677b" font-weight="400" text-anchor="start">“进程启动”与“能聊天”之间，还有连接与配置检查。</text>
<rect x="32" y="118" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="157" r="19" fill="#247d75"/><text x="65" y="165" font-size="22" fill="white" font-weight="600" text-anchor="middle">1</text><text x="105" y="166" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">主程序正常</text><text x="396" y="166" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">看日志，确认启动成功</text><rect x="32" y="219" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="258" r="19" fill="#247d75"/><text x="65" y="266" font-size="22" fill="white" font-weight="600" text-anchor="middle">2</text><text x="105" y="267" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">QQ 与协议连接正常</text><text x="396" y="267" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">Bot 的账号已登录；适配器已连接</text><rect x="32" y="320" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="359" r="19" fill="#247d75"/><text x="65" y="367" font-size="22" fill="white" font-weight="600" text-anchor="middle">3</text><text x="105" y="368" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">模型服务可用</text><text x="396" y="368" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">API Key、模型、任务配置与账户额度</text><rect x="32" y="421" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="460" r="19" fill="#247d75"/><text x="65" y="468" font-size="22" fill="white" font-weight="600" text-anchor="middle">4</text><text x="105" y="469" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">主人账号正确</text><text x="396" y="469" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">填的是你的账号，区别于 Bot 账号</text><rect x="32" y="522" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="561" r="19" fill="#247d75"/><text x="65" y="569" font-size="22" fill="white" font-weight="600" text-anchor="middle">5</text><text x="105" y="570" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">实际验证回复</text><text x="396" y="570" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">用主人账号私聊 Bot，确认收发正常</text><text x="32" y="632" font-size="18" fill="#52677b" font-weight="400" text-anchor="start">检查示意 · 有问题先看相关进程日志</text></g></svg>
