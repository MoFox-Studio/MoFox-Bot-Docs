<svg xmlns="http://www.w3.org/2000/svg" width="960" height="346" viewBox="0 0 960 346" role="img" aria-labelledby="title desc">
<title id="title">发现文档问题，从当前页反馈</title><desc id="desc">虫子图标会自动附带当前页面信息。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#247d75"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
<rect x="1" y="1" width="958" height="344" rx="22" fill="#f7f9fc" stroke="#d5e0eb" stroke-width="2"/>
<text x="32" y="53" font-size="29" fill="#20384e" font-weight="700" text-anchor="start">发现文档问题，从当前页反馈</text>
<text x="32" y="88" font-size="20" fill="#52677b" font-weight="400" text-anchor="start">虫子图标会自动附带当前页面信息。</text>
<rect x="32" y="116" width="270" height="164" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="62" cy="148" r="19" fill="#247d75"/><text x="62" y="156" font-size="22" fill="white" font-weight="600" text-anchor="middle">1</text><text x="92" y="156" font-size="23" fill="#20384e" font-weight="600" text-anchor="start">GitHub 登录授权</text><text x="52" y="201" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">点击虫子 → 前往授权</text><text x="52" y="231" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">完成后回到来源页</text><path d="M310 198 L336 198" fill="none" stroke="#247d75" stroke-width="3" marker-end="url(#arrow)"/><rect x="344" y="116" width="270" height="164" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="374" cy="148" r="19" fill="#247d75"/><text x="374" y="156" font-size="22" fill="white" font-weight="600" text-anchor="middle">2</text><text x="404" y="156" font-size="23" fill="#20384e" font-weight="600" text-anchor="start">已登录：站内编辑</text><text x="364" y="201" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">再次点击虫子</text><text x="364" y="231" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">修改标题与复现步骤</text><path d="M622 198 L648 198" fill="none" stroke="#247d75" stroke-width="3" marker-end="url(#arrow)"/><rect x="656" y="116" width="270" height="164" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="686" cy="148" r="19" fill="#247d75"/><text x="686" y="156" font-size="22" fill="white" font-weight="600" text-anchor="middle">3</text><text x="716" y="156" font-size="23" fill="#20384e" font-weight="600" text-anchor="start">提交：查看 Issue</text><text x="676" y="201" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">成功后展示 Issue 链接</text><text x="676" y="231" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">顶栏用户名处可退出</text><text x="32" y="321" font-size="18" fill="#52677b" font-weight="400" text-anchor="start">兜底入口：直接去 GitHub 提交，同样预填页面信息</text></g></svg>
