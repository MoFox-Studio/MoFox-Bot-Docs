<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
<rect x="1" y="1" width="958" height="344" rx="22" fill="#f7f9fc" stroke="#d5e0eb" stroke-width="2"/>
<text x="32" y="53" font-size="29" fill="#20384e" font-weight="700" text-anchor="start">排查问题：找到最新日志</text>
<text x="32" y="88" font-size="20" fill="#52677b" font-weight="400" text-anchor="start">从 Bot 目录的 logs/ 开始定位。</text>
<rect x="32" y="116" width="270" height="164" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="62" cy="148" r="19" fill="#247d75"/><text x="62" y="156" font-size="22" fill="white" font-weight="600" text-anchor="middle">1</text><text x="92" y="156" font-size="23" fill="#20384e" font-weight="600" text-anchor="start">进入 logs/ 目录</text><text x="52" y="201" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">查看 mofox_*.log 文件</text><text x="52" y="231" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">按修改时间找最新文件</text><path d="M310 198 L336 198" fill="none" stroke="#247d75" stroke-width="3" marker-end="url(#arrow)"/><rect x="344" y="116" width="270" height="164" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="374" cy="148" r="19" fill="#247d75"/><text x="374" y="156" font-size="22" fill="white" font-weight="600" text-anchor="middle">2</text><text x="404" y="156" font-size="23" fill="#20384e" font-weight="600" text-anchor="start">查找报错位置</text><text x="364" y="201" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">搜索 ERROR 等关键词</text><text x="364" y="231" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">保留报错前后的上下文</text><path d="M622 198 L648 198" fill="none" stroke="#247d75" stroke-width="3" marker-end="url(#arrow)"/><rect x="656" y="116" width="270" height="164" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="686" cy="148" r="19" fill="#247d75"/><text x="686" y="156" font-size="22" fill="white" font-weight="600" text-anchor="middle">3</text><text x="716" y="156" font-size="23" fill="#20384e" font-weight="600" text-anchor="start">对照当前操作</text><text x="676" y="201" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">记录版本、步骤与现象</text><text x="676" y="231" font-size="21" fill="#52677b" font-weight="400" text-anchor="start">分享前遮住账号和密钥</text><text x="32" y="321" font-size="18" fill="#52677b" font-weight="400" text-anchor="start">路径与排查示意 · 非文件管理器截图</text></g></svg>
