<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="title desc">
<title id="title">手动安装插件：文件应该放在哪</title><desc id="desc">下面展示目录关系；示例名称可换成你的插件名。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#247d75"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
<rect x="1" y="1" width="958" height="554" rx="22" fill="#f7f9fc" stroke="#d5e0eb" stroke-width="2"/>
<text x="32" y="53" font-size="29" fill="#20384e" font-weight="700" text-anchor="start">手动安装插件：文件应该放在哪</text>
<text x="32" y="88" font-size="20" fill="#52677b" font-weight="400" text-anchor="start">下面展示目录关系；示例名称可换成你的插件名。</text>
<rect x="32" y="118" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="157" r="19" fill="#247d75"/><text x="65" y="165" font-size="22" fill="white" font-weight="600" text-anchor="middle">1</text><text x="105" y="166" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">Neo-MoFox/plugins/</text><text x="396" y="166" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">插件包或插件源码的目标目录</text><rect x="32" y="219" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="258" r="19" fill="#247d75"/><text x="65" y="266" font-size="22" fill="white" font-weight="600" text-anchor="middle">2</text><text x="105" y="267" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">插件包：example.mfp</text><text x="396" y="267" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">下载到的 .mfp / .zip 可直接放入</text><rect x="32" y="320" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="359" r="19" fill="#247d75"/><text x="65" y="367" font-size="22" fill="white" font-weight="600" text-anchor="middle">3</text><text x="105" y="368" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">源码目录</text><text x="396" y="368" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">example_plugin/：包含 manifest.json</text><rect x="32" y="421" width="896" height="78" rx="18" fill="white" stroke="#d5e0eb" stroke-width="2"/><circle cx="65" cy="460" r="19" fill="#247d75"/><text x="65" y="468" font-size="22" fill="white" font-weight="600" text-anchor="middle">4</text><text x="105" y="469" font-size="25" fill="#20384e" font-weight="600" text-anchor="start">放好之后</text><text x="396" y="469" font-size="22" fill="#52677b" font-weight="400" text-anchor="start">重启 Bot，再查日志确认插件已加载</text><text x="32" y="531" font-size="18" fill="#52677b" font-weight="400" text-anchor="start">目录示意 · 不要把插件本体放进 config/、data/ 或 logs/</text></g></svg>
