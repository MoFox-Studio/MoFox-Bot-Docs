# 模型服务配置（演示用）
# 修改后重启程序生效

[model]
name = "GLM-4-Flash"
temperature = 0.7
max_tokens = 2048
stream = true

[model.api]
# 密钥请自行申请，别提交到 git
key = "sk-xxxxxxxxxxxxxxxxxxxxxxxx"
base_url = "https://open.bigmodel.cn/api/paas/v4/"
timeout = 30

[persona]
# 人设名称对应 persona/ 目录下的文件
default = "小狐狸"
switch_command = "/persona"

[[memory.book]]
enabled = true
path = "data/booku_memory"
auto_learn = true
